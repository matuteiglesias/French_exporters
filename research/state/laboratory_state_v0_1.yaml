current_bottleneck: >
  The legacy repository contains candidate notebooks and generated outputs, but
  the export variance-decay chain is not executable from a documented input,
  command, estimator, and output path.

current_play:
  mode: "BUILD"
  lead_player: "Reproducibility Engineer"
  supporting_players:
    - "Archivist"
    - "Methodkeeper"
  objective: >
    Map the legacy export-alpha evidence chain and extract the smallest runnable
    reproduction target without changing scientific meaning.
  completion_condition: >
    AGG-ALPHA-EXPORT has an inspected input path, executable entry point,
    estimator specification, output path, reproduction result, and exact blocker.

repository_evidence:
  repository: "matuteiglesias/French_exporters"
  default_branch: "master"
  recovery_branch: "agent/research-governance-recovery"
  repository_size_kb: 761425
  git_lfs:
    configured: true
    pattern: "*.csv"
  inspected_candidates:
    - path: "notebooks/02_Statistical_Analysis_and_Modeling/Thesis/Experiment 5. Simple var vs nq, s. (s).ipynb"
      state: "REVIEW"
      evidence: >
        Reads ../../../data/processed/ID_Y.csv, filters IMPORT == 0, constructs
        firm-year VART, simulates shocks, computes variance by groups, and writes
        ../../../data/processed/aggregated_simulation_results.csv.
      blocker: >
        Expected ID_Y.csv was not located in the inspected current-branch paths;
        the committed generated output is stored under the notebook directory,
        not the notebook's declared output path.
    - path: "notebooks/02_Statistical_Analysis_and_Modeling/Thesis/Covariance Terms Bootstrap Experiments.ipynb"
      state: "REVIEW"
      evidence: >
        Reads ../../data/processed/ID_Y.csv and contains bootstrap/covariance
        decomposition logic relevant to the flagship mechanism.
    - path: "data/bootstraps/"
      state: "REVIEW"
      evidence: >
        Contains random/sorted, linear/log, import/export covariance and
        partition output families tracked through Git LFS.
    - path: "notebooks/bkp_misc_data/exp_var_norm_1s.csv"
      state: "REVIEW"
      evidence: "Candidate legacy export variance output; content not yet inspected."

claim_evidence:
