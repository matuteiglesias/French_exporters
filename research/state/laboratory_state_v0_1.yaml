    claim_id: "AGG-ALPHA-EXPORT"
    claim: >
      Export idiosyncratic variance decays with population size with exponent
      approximately 0.48 to 0.50.
    current_status: "BLOCKED"
    reported_alpha: "approximately 0.48-0.50"
    reproduced_alpha: null
    first_missing_dependency: >
      Recover the actual ID_Y.csv LFS object or establish the authoritative
      predecessor pipeline that regenerates it.
    known_uncertainties:
      - "sign convention for alpha versus fitted slope"
      - "which notebook/output is the authoritative flagship result"
      - "randomness is not seeded in the inspected Experiment 5 notebook"
      - "grouping uses cumulative size cuts and requires estimand review"
      - "output path drift between notebook code and committed artifact"

